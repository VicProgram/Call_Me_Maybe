[project]

	name = "call_me_maybe"
	version = "0.1.0"
	description = "A constrained decoding project for LLMs"

requires-python = ">=3.10"

dependencies = [
	"numpy",
	"pydantic",
    "llm_sdk"
	]

[tool.mypy]
	strict = true

# mypy
[[tool.mypy.overrides]]
module = "llm_sdk.*"
ignore_missing_imports = true

[tool.uv.sources]
    llm_sdk = { path = "llm_sdk" }
