name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install numpy pydantic pytest
      - name: Run tests
        run: pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint dependencies
        run: pip install numpy pydantic flake8 mypy
      - name: flake8
        run: flake8 . --exclude=data,llm_sdk,.venv
      - name: mypy
        run: >
          mypy . --warn-return-any --warn-unused-ignores
          --ignore-missing-imports --disallow-untyped-defs
          --check-untyped-defs --exclude data --exclude llm_sdk
          --exclude .venv --exclude tests
